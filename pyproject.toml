[project]
name = "eu-reg-mcp"
version = "0.1.0"
description = "MCP server giving AI agents cited, review-gated grounding in EU regulation: ESMA MiCAR register search, register change tracking, white paper linting, EU AI Act classification."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Foerste" }]
keywords = ["mcp", "model-context-protocol", "eu", "regulation", "micar", "esma", "ai-act", "compliance", "crypto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
lint = [
    "micar-whitepaper-linter @ git+https://github.com/sebastianfoerste/micar-whitepaper-linter",
]
classify = [
    "eu-ai-act-classifier @ git+https://github.com/sebastianfoerste/eu-ai-act-classifier",
]

[project.urls]
Homepage = "https://github.com/sebastianfoerste/eu-reg-mcp"
Repository = "https://github.com/sebastianfoerste/eu-reg-mcp"
Issues = "https://github.com/sebastianfoerste/eu-reg-mcp/issues"

[project.scripts]
eu-reg-mcp = "eu_reg_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/eu_reg_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
