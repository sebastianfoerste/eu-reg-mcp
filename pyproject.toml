[project]
name = "eu-reg-mcp"
version = "0.2.0"
description = "MCP server giving AI agents cited, review-gated grounding in EU regulation: ESMA MiCAR register search, register change tracking, white paper linting, EU AI Act classification."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Förste" }]
keywords = ["mcp", "model-context-protocol", "eu", "regulation", "micar", "esma", "ai-act", "compliance", "crypto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.30.0,<2"]

[project.optional-dependencies]
lint = [
    "micar-whitepaper-linter>=0.2.1",
]
classify = [
    "eu-ai-act-classifier>=0.2.2",
]

# PEP 735 group: `uv sync` installs it by default, and PyPI no longer
# advertises a `dev` extra.
[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/sebastianfoerste/eu-reg-mcp"
Repository = "https://github.com/sebastianfoerste/eu-reg-mcp"
Issues = "https://github.com/sebastianfoerste/eu-reg-mcp/issues"

[project.scripts]
eu-reg-mcp = "eu_reg_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/eu_reg_mcp"]

# An explicit sdist, so .github/, uv.lock, docs/research/ and stray local
# files cannot ship; tests and the docs they read are included.
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "scripts/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "server.json",
    "pyproject.toml",
]
exclude = ["docs/research/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
