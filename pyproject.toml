[project]
name = "eu-reg-mcp"
version = "0.1.0"
description = "MCP server giving AI agents cited, review-gated grounding in EU regulation: ESMA MiCAR register search, register change tracking, white paper linting, EU AI Act classification."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sebastian Förste" }]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
lint = [
    "micar-whitepaper-linter @ git+https://github.com/sebastianfoerste/micar-whitepaper-linter@v0.1.0",
]
classify = [
    "eu-ai-act-classifier @ git+https://github.com/sebastianfoerste/eu-ai-act-classifier@v0.1.0",
]

[project.scripts]
eu-reg-mcp = "eu_reg_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/eu_reg_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
