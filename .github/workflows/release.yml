name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Verify release tag matches metadata and changelog
        shell: bash
        run: |
          uv run --no-project python - "${GITHUB_REF_NAME}" <<'PY'
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          tag = sys.argv[1]
          expected_prefix = "v"
          if not tag.startswith(expected_prefix):
              raise SystemExit(f"release tag must start with 'v': {tag}")
          tag_version = tag[len(expected_prefix):]

          pyproject_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if pyproject_version != tag_version:
              raise SystemExit(
                  f"pyproject.toml version ({pyproject_version}) != tag ({tag_version})"
              )

          server = json.loads(Path("server.json").read_text(encoding="utf-8"))
          if server["version"] != tag_version:
              raise SystemExit(
                  f"server.json version ({server['version']}) != tag ({tag_version})"
              )
          for idx, pkg in enumerate(server.get("packages", [])):
              if pkg["version"] != tag_version:
                  raise SystemExit(
                      f"server.json packages[{idx}].version ({pkg['version']}) != tag ({tag_version})"
                  )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"^## (\S+) \(([^)]+)\)$", changelog, re.MULTILINE)
          if not match:
              raise SystemExit("no version heading found in CHANGELOG.md")
          cl_version, cl_date = match.groups()
          if cl_version != tag_version:
              raise SystemExit(
                  f"CHANGELOG.md top version ({cl_version}) != tag ({tag_version})"
              )
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", cl_date):
              raise SystemExit(
                  f"CHANGELOG.md top heading must carry YYYY-MM-DD date, got {cl_date!r}"
              )
          PY

      - name: Run offline test suite
        run: |
          uv sync --locked --extra lint --extra classify
          uv run pytest -q

      - name: Build distribution packages
        run: uv build

      - name: Smoke-test built wheel in clean virtual environment
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          uv venv --python 3.13 "$tmp/venv"
          uv pip install --python "$tmp/venv/bin/python" dist/*.whl
          "$tmp/venv/bin/eu-reg-mcp" --help >/dev/null

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-mcp-registry:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
