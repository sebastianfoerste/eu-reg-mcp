name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --extra dev --extra lint --extra classify
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  install-smoke:
    name: install smoke (uvx + MCP stdio client)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Installs this ref the way the README does (uvx, both extras, fresh
      # resolution that ignores uv.lock), starts the server over stdio, lists
      # its tools and calls classify, lint and the register summary (a network
      # fetch of the observatory's weekly snapshot). The weekly live-data
      # workflow runs the same check against the release on PyPI.
      - run: >-
          uv run --isolated --no-project --with 'mcp>=1.2,<2'
          python scripts/smoke_list_tools.py --check-register --
          uvx --python 3.13 --refresh --from '.[lint,classify]' eu-reg-mcp
