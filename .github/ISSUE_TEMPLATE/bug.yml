name: Bug report
description: Something in eu-reg-mcp does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or MCP client config used
  - type: input
    id: version
    attributes:
      label: eu-reg-mcp version and Python version
